name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@"$SSH_HOST" "
            cd /home/ubuntu/yotrack &&
            git pull origin main &&
            pnpm install --frozen-lockfile &&
            pnpm --filter @yotrack/api build &&
            pnpm --filter @yotrack/admin build &&
            pm2 restart yotrack-api &&
            pm2 restart yotrack-gateway &&
            echo Deploy complete
          "
